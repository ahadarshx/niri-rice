# Your own matugen templates. DMS runs these too ("Run user templates" in
# DMS Settings → Wallpaper & colors), every time your wallpaper colours change.
[config]

[templates.obsidian]
input_path = '~/.config/matugen/templates/obsidian-dms.css'
output_path = '~/Documents/obsidian/.obsidian/snippets/dms-material.css'

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/dms.theme'

[templates.cava]
input_path = '~/.config/matugen/templates/cava.config'
output_path = '~/.config/cava/config'
